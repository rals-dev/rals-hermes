name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/grafana/**"
      - "deploy/prometheus/**"
      - "deploy/alloy/**"
      - "deploy/traefik/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push to a PR supersedes an in-flight run. Runs on main queue
# instead: cancelling one could cut a deploy off mid-way. PR runs are keyed
# by event and head branch: a PR run queued after its merge sees
# github.ref = refs/heads/main and would otherwise cancel main's run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/bff ./cmd/bff

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    # Host-side deploy scripts (ADR-025). Not a dependency of the image job:
    # they never ship in it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/hermes-dashboard/*.sh
      - name: test
        run: bash deploy/hermes-dashboard/profile_test.sh

  image:
    # Builds on every push to main and on version tags; publishes to GHCR
    # under the repository's own name (ADR-015).
    needs: [go, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Rolls the image just published for this commit onto the homelab host
    # (docs/runbook.md § 2). Main only. The production environment holds the
    # secrets and requires an approval; the runner joins the tailnet as an
    # ephemeral tag:ci node and its SSH key can only run deploy.sh, which
    # rolls back by itself if /healthz does not report the new version.
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.DASHBOARD_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # Not 22: with Tailscale SSH on, the host's tailnet port 22 bypasses
          # sshd and the authorized_keys restriction on this key.
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '2222' }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The forced command reads the tag from the SSH command line.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "${GITHUB_SHA::7}"
