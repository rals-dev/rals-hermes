global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: hermes-bff
    # Container name on proxy-net; /metrics needs no session (PRD § 5).
    static_configs:
      - targets: ["hermes-dashboard:8080"]
        labels:
          host: srv01-rals

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
