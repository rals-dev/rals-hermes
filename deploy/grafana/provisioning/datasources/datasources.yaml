apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: $LOKI_URL
    editable: false
